<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        body {
            background: linear-gradient(135deg, #895abc 0%, #6b9ad3 50%, #9fe966 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #e2c0ff;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery img {
            width: 270px;
            height: 270px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        .gallery img:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 30px rgba(186, 104, 200, 0.5);
            border-color: #d8b4fe;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 style="color: #0c0c0c;">Photo Gallery</h1>

    <div class="gallery">

        <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=500" alt="College Event">
        <img src="https://images.unsplash.com/photo-1475721027785-f74eccf877e2?w=500" alt="Seminar Event">
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=500" alt="Student Event">
        <img src="https://images.unsplash.com/photo-1511578314322-379afb476865?w=500" alt="Campus Event">
        <img src="https://picsum.photos/300/300?5" alt="Gallery Image 5">
        <img src="https://picsum.photos/300/300?6" alt="Gallery Image 6">
        <img src="https://picsum.photos/300/300?7" alt="Gallery Image 7">
        <img src="https://picsum.photos/300/300?8" alt="Gallery Image 8">
        <img src="https://picsum.photos/300/300?9" alt="Gallery Image 9">
        <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=500" alt="College Event">
        <img src="https://images.unsplash.com/photo-1475721027785-f74eccf877e2?w=500" alt="Seminar Event">
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=500" alt="Student Event">
        <img src="https://images.unsplash.com/photo-1511578314322-379afb476865?w=500" alt="Campus Event">
        <img src="https://picsum.photos/300/300?5" alt="Gallery Image 5">
        <img src="https://picsum.photos/300/300?6" alt="Gallery Image 6">
        <img src="https://picsum.photos/300/300?7" alt="Gallery Image 7">


    </div>

</body>

</html>
