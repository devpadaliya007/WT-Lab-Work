<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .h1 {
            text-align: center;
        }

        /* Bouncing Loader */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .ball {
            width: 20px;
            height: 20px;
            background-color: rgb(223, 49, 54);
            border-radius: 50%;
            margin: 5px;
            animation: bounce 0.6s infinite alternate;
        }

        .ball:nth-child(2) {
            animation-delay: 0.2s;
        }

        .ball:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-40px);
            }
        }


        /* Photo Gallery */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }

        .gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Flex Container and Flex Child */
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 300px;
            background-color: rgb(135, 87, 87);
        }

        .box {
            flex: 2;
            margin: 30px;
            padding: 30px;
            text-align: center;
            background-color: rgb(230, 137, 205);
            color: white;
            height: 150px;


        }

        .box2 {
            flex: 2;

        }
    </style>
</head>

<body style="background-color: powderblue;">
    <h1 class="h1">Bouncing Loader</h1>
    <div class="loader">
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
    </div>

    <h1 class="h1">Photo Gallery</h1>
    <div class="gallery">
        <img src="https://picsum.photos/200/150?1">
        <img src="https://picsum.photos/200/150?2">
        <img src="https://picsum.photos/200/150?3">
        <img src="https://picsum.photos/200/150?4">
        <img src="https://picsum.photos/200/150?5">
        <img src="https://picsum.photos/200/150?6">
        <img src="https://picsum.photos/200/150?7">
        <img src="https://picsum.photos/200/150?8">
        <img src="https://picsum.photos/200/150?5">
        <img src="https://picsum.photos/200/150?6">
        <img src="https://picsum.photos/200/150?7">
        <img src="https://picsum.photos/200/150?8">

    </div><br><br>

    <h1 class="h1">Flex Container and Flex Child</h1>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>

</html>
