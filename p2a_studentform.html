<html>
<head>
    <title>form</title>
</head>

<body>
    <table>

        <tr>
            <th><label>Full Name</label></th>
            <th><input type="text" name=""></th>

        </tr>

        <tr>
            <th><label>Qualification</label></th>

                <select>
                    <option>10<sup>pass</option>

        <tr>

        <tr>

        <tr>

                    <option>2018</option>
                    <option>2019</option>
                    <option>2020</option>
                    <option>2021</option>
                </select>

        </tr>

        <tr>
            <th colspan="2">

        </tr>
