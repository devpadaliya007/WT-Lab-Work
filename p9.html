<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MU Campus Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    .hero {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
    }

    .product-card {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
    }

    .product-img {
      height: 180px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-info" href="#">MU Store</a>
      <button class="btn btn-info text-dark fw-bold position-relative" data-bs-toggle="offcanvas"
        data-bs-target="#cart">
        Cart <span id="cartCount" class="badge bg-danger rounded-circle">0</span>
      </button>
    </div>
  </nav>

  <!-- Banner -->
  <div class="hero text-center py-4">
    <h2 class="fw-bold mb-1">Campus Merchandise</h2>
    <p class="text-info small mb-0">Official Apparel & Gear</p>
  </div>

  <!-- Products Section -->
  <div class="container my-4">
    <h4 class="fw-bold mb-3">Products</h4>
    <div class="row g-3">

      <!-- Card 1 -->
      <div class="col-6 col-md-3">
        <div class="card product-card h-100 p-2">
          <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400&auto=format&fit=crop"
            class="card-img-top product-img rounded" alt="Hoodie">
          <div class="card-body p-2 d-flex flex-column justify-content-between">
            <div>
              <h6 class="fw-bold mb-1">Campus Hoodie</h6>
              <p class="text-muted small mb-2">₹1,299</p>
            </div>
            <button class="btn btn-dark btn-sm text-info w-100 fw-bold add-btn" data-name="Campus Hoodie"
              data-price="1299">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Card 2 (Updated T-Shirt Image) -->
      <div class="col-6 col-md-3">
        <div class="card product-card h-100 p-2">
          <img src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=400&auto=format&fit=crop"
            class="card-img-top product-img rounded" alt="Polo T-Shirt">
          <div class="card-body p-2 d-flex flex-column justify-content-between">
            <div>
              <h6 class="fw-bold mb-1">Polo T-Shirt</h6>
              <p class="text-muted small mb-2">₹599</p>
            </div>
            <button class="btn btn-dark btn-sm text-info w-100 fw-bold add-btn" data-name="Polo T-Shirt"
              data-price="599">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-6 col-md-3">
        <div class="card product-card h-100 p-2">
          <img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400&auto=format&fit=crop"
            class="card-img-top product-img rounded" alt="Steel Bottle">
          <div class="card-body p-2 d-flex flex-column justify-content-between">
            <div>
              <h6 class="fw-bold mb-1">Steel Flask</h6>
              <p class="text-muted small mb-2">₹449</p>
            </div>
            <button class="btn btn-dark btn-sm text-info w-100 fw-bold add-btn" data-name="Steel Flask"
              data-price="449">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="col-6 col-md-3">
        <div class="card product-card h-100 p-2">
          <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&auto=format&fit=crop"
            class="card-img-top product-img rounded" alt="Backpack">
          <div class="card-body p-2 d-flex flex-column justify-content-between">
            <div>
              <h6 class="fw-bold mb-1">Backpack</h6>
              <p class="text-muted small mb-2">₹899</p>
            </div>
            <button class="btn btn-dark btn-sm text-info w-100 fw-bold add-btn" data-name="Backpack"
              data-price="899">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Cart Offcanvas Drawer -->
  <div class="offcanvas offcanvas-end" id="cart">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title text-info">Your Cart</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column justify-content-between">
      <ul id="cartList" class="list-group list-group-flush"></ul>
      <div class="border-top pt-3">
        <h5 class="fw-bold mb-3">Total: ₹<span id="cartTotal">0</span></h5>
        <a href="#checkout" class="btn btn-dark text-info w-100 fw-bold" data-bs-dismiss="offcanvas">Proceed to
          Checkout</a>
      </div>
    </div>
  </div>

  <!-- Checkout Form -->
  <div class="container my-5" id="checkout">
    <div class="p-4 rounded border bg-light shadow-sm">
      <h4 class="fw-bold mb-3">Checkout</h4>
      <form id="orderForm">
        <div class="row g-2">
          <div class="col-md-6"><input type="text" class="form-control" placeholder="Full Name" required></div>
          <div class="col-md-6"><input type="email" class="form-control" placeholder="Email Address" required></div>
          <div class="col-12"><input type="text" class="form-control" placeholder="Home Address" required></div>
          <div class="col-12 text-center mt-3">
            <button type="submit" class="btn btn-dark text-info fw-bold px-4">Place Order</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-light text-center py-3">
    <p class="small mb-0 text-info">Marwadi University, Rajkot © 2026</p>
  </footer>

  <!-- Bootstrap & JS Cart Logic -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let cart = [];
    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        cart.push({ name: btn.dataset.name, price: Number(btn.dataset.price) });
        updateCart();
      });
    });
    function updateCart() {
      document.getElementById('cartCount').innerText = cart.length;
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cartTotal').innerText = total;
      document.getElementById('cartList').innerHTML = cart.map(i => `<li class="list-group-item d-flex justify-content-between"><span>${i.name}</span><b>₹${i.price}</b></li>`).join('');
    }
    document.getElementById('orderForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Order Placed Successfully!');
      cart = []; updateCart(); e.target.reset();
    });
  </script>
</body>

</html>
