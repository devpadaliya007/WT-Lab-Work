<!DOCTYPE html>
<html>
<head>
    <title>Placement Dashboard</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f6f9;
        }

        .header{
            background:#17ad58;
            color:white;
            padding:20px;
            text-align:center;
            margin-bottom:20px;
            
        }

        .navbar{
            background:#a535b9;
            padding:15px;
            text-align:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:20px;
            font-weight:bold;
        }

        .container{
            width:90%;
            margin:auto;
            margin-top:40px;
        }

        .card{
            width:22%;
            display:inline-block;
            background:rgb(122, 211, 234);
            margin:10px;
            padding:20px;
            text-align:center;
            border-radius:8px;  
            box-shadow:0px 0px 8px gray;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
            background:rgb(233, 217, 38);
        }

        table,th,td{
            border:1px solid black;
        }

        th{
            background:#3678be;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
        }

    </style>
</head>

<body>

    <div class="header">
    <h1>Placement Dashboard</h1>
    </div>

    <div class="navbar">
    <a href="#">Home</a>
    <a href="#">Students</a>
    <a href="#">Companies</a>
    <a href="#">Placements</a>
    <a href="#">Logout</a>
    </div>

    <div class="container">

    <div class="card">
    <h2>250</h2>
    <p>Students</p>
    </div>

    <div class="card">
    <h2>40</h2>
    <p>Companies</p>
    </div>

    <div class="card">
    <h2>180</h2>
    <p>Placed</p>
    </div>

    <div class="card">
    <h2>72%</h2>
    <p>Placement Rate</p>
    </div>

    <table>

    <tr>
    <th>Company</th>
    <th>Package</th>
    <th>Students Selected</th>
    <th>Status</th>
    </tr>

    <tr>
    <td>TCS</td>
    <td>4 LPA</td>
    <td>50</td>
    <td>Completed</td>
    </tr>

    <tr>
    <td>Infosys</td>
    <td>5 LPA</td>
    <td>35</td>
    <td>Completed</td>
    </tr>

    <tr>
    <td>Wipro</td>
    <td>4.5 LPA</td>
    <td>28</td>
    <td>Ongoing</td>
    </tr>

    <tr>
    <td>Microsoft</td>
    <td>6 LPA</td>
    <td>40</td>
    <td>Upcoming</td>
    </tr>

    </table>
    </div>

</body>
</html>
